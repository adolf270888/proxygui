name: Build ProxyGUI APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip build-essential ccache \
            libltdl-dev libtool pkg-config autoconf automake

      - name: Install Buildozer
        run: pip install buildozer cython

      - name: Preinstall Android SDK
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p "$SDK_DIR/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          rm -rf "$SDK_DIR/tools"
          ln -s "$SDK_DIR/cmdline-tools/latest" "$SDK_DIR/tools"
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
          echo "Java version:" && java -version
          # Лицензии принимаем и через sdkmanager, и записью файлов-согласий
          yes | sdkmanager --licenses > /dev/null || true
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          mkdir -p "$SDK_DIR/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          echo "--- verify sdkmanager placement ---"
          ls -l "$SDK_DIR/tools/bin/sdkmanager"
          echo "SDK contents:" && ls "$SDK_DIR/build-tools"

      - name: Patch buildozer.spec
        run: |
          python - <<'EOF'
          import re
          p = "buildozer.spec"
          lines = open(p).read().splitlines()
          def setkey(lines, key, val):
              pat = re.compile(rf'^#?\s*{re.escape(key)}\s*=')
              out, in_app, done = [], False, False
              for ln in lines:
                  s = ln.strip().lower()
                  if s == '[app]': in_app = True
                  elif s.startswith('[') and s != '[app]': in_app = False
                  if pat.match(ln):
                      if in_app and not done:
                          out.append(f"{key} = {val}")
                          done = True
                      continue
                  out.append(ln)
              if not done:
                  for i, ln in enumerate(out):
                      if ln.strip().lower() == '[app]':
                          out.insert(i + 1, f"{key} = {val}")
                          done = True
                          break
                  if not done:
                      out.append("[app]")
                      out.append(f"{key} = {val}")
              return out
          for key, val in [
              ("android.accept_sdk_license", "True"),
              ("android.build_tools_version", "34.0.0"),
              ("p4a.branch", "v2024.01.21"),
              ("android.extra_manifest_application_arguments", "manifest_args.txt"),
          ]:
              lines = setkey(lines, key, val)
          open(p, "w").write("\n".join(lines) + "\n")
          print("patched [app] section:")
          in_app = False
          for ln in lines:
              s = ln.strip().lower()
              if s == '[app]': in_app = True
              elif s.startswith('['): in_app = False
              if in_app and re.match(r'(android\.accept_sdk_license|android\.build_tools_version|p4a\.branch|android\.extra_manifest_application_arguments)\s*=', ln):
                  print(" ", ln)
          EOF

      - name: Create manifest args file
        run: printf 'android:usesCleartextTraffic="true"\n' > manifest_args.txt    
          
      - name: Build APK
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          if [ ! -e "$SDK_DIR/tools/bin/sdkmanager" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            rm -rf "$SDK_DIR/tools"
            ln -s "$SDK_DIR/cmdline-tools/latest" "$SDK_DIR/tools"
          fi
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true

          # Предварительное клонирование p4a с повторными попытками
          P4A_DIR=$HOME/.buildozer/android/platform/python-for-android
          if [ ! -d "$P4A_DIR/.git" ]; then
            for i in 1 2 3; do
              echo "=== Клонирование p4a, попытка $i ==="
              if git clone -b v2024.01.21 --single-branch https://github.com/kivy/python-for-android.git "$P4A_DIR"; then
                break
              fi
              rm -rf "$P4A_DIR"
              [ "$i" = "3" ] && { echo "CLONE FAILED"; exit 1; }
              sleep 10
            done
          fi

          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log


      - name: Show build log tail on failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "===== СТРОКИ С ОШИБКАМИ ====="
            grep -i -n -E "error|fatal|failed|denied|not found|Traceback|CRITICAL" build.log | tail -n 50
            echo "===== НАЧАЛО ЛОГА ====="
            head -n 60 build.log
            echo "===== ХВОСТ ЛОГА ====="
            tail -n 120 build.log | head -c 20000
          else
            echo "build.log не создан — сборка упала до запуска Buildozer"
          fi


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: proxygui-apk
          path: bin/*.apk
