name: Build ProxyGUI APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip build-essential ccache \
            libltdl-dev libtool pkg-config autoconf automake

      - name: Install Buildozer
        run: pip install buildozer cython

      - name: Preinstall Android SDK
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p "$SDK_DIR/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          rm -rf "$SDK_DIR/tools"
          ln -s "$SDK_DIR/cmdline-tools/latest" "$SDK_DIR/tools"
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
          echo "Java version:" && java -version
          # Лицензии принимаем и через sdkmanager, и записью файлов-согласий
          yes | sdkmanager --licenses > /dev/null || true
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          mkdir -p "$SDK_DIR/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          echo "--- verify sdkmanager placement ---"
          ls -l "$SDK_DIR/tools/bin/sdkmanager"
          echo "SDK contents:" && ls "$SDK_DIR/build-tools"

      - name: Patch buildozer.spec
        run: |
          python - <<'EOF'
          import re
          p = "buildozer.spec"
          s = open(p).read()
          def setkey(s, key, val):
              pat = rf'^#?\s*{re.escape(key)}\s*=.*$'
              repl = f"{key} = {val}"
              if re.search(pat, s, re.M):
                  return re.sub(pat, repl, s, count=1, flags=re.M)
              return s + f"\n{repl}\n"
          s = setkey(s, "android.accept_sdk_license", "True")
          s = setkey(s, "android.build_tools_version", "34.0.0")
          s = setkey(s, "p4a.branch", "2024.10.1")
          open(p, "w").write(s)
          print("patched:")
          EOF
          grep -n "accept_sdk_license\|build_tools_version\|p4a.branch" buildozer.spec
      
      - name: Build APK
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          if [ ! -e "$SDK_DIR/tools/bin/sdkmanager" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            rm -rf "$SDK_DIR/tools"
            ln -s "$SDK_DIR/cmdline-tools/latest" "$SDK_DIR/tools"
          fi
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log


      - name: Show build log tail on failure
        if: failure()
        run: |
          echo "===== ПАДАЮЩАЯ КОМАНДА ====="
          grep -n "Run '" build.log | tail -n 5
          echo "===== TRACEBACK / ОШИБКИ ====="
          grep -n -A 12 -E "Traceback|CRITICAL|Exception|failed with output" build.log | tail -n 100
          echo "===== КОНЕЦ ЛОГА ====="
          tail -n 100 build.log | head -c 20000

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: proxygui-apk
          path: bin/*.apk
